    const [value, setValue] = useState(() => {
        try {
            const stickyValue = window.localStorage.getItem(key);
            // 【關鍵修改】：加入 JSON 格式驗證
            if (stickyValue !== null) {
                return JSON.parse(stickyValue);
            }
            return defaultValue;
        } catch (e) {

               // 這裡一定要用 generateId() 產生唯一的 cartId，React 才知道這是一張永遠的單
    const newItem = {

};

            const handlePendingOrder = () => {

const finalCustId = selectedCustomer ? selectedCustomer.id : null;

=>s.id===t.mainStylistId)?.name || '未知設計師'}</div></div></div>)))}</div></div><div className="flex gap-2 pt-2"><button onClick={()=>{setEditForm(viewingCustomer); setIsEditing(true);}} className="btn btn-secondary flex-1">編輯資料</button><button onClick={()=>handleDeleteCustomer(viewingCustomer.id)} className="btn btn-danger flex-1">刪除會員</button></div></div></Modal>)}

const SettingsView = () => {
    const [categoryInput, setCategoryInput] = useState('');
    const [expenseTypeInput, setExpenseTypeInput] = useState('');
    const [isEditingItem, setIsEditingItem] = useState(false);
    const [itemForm, setItemForm] = useState({});
    const [itemSearch, setItemSearch] = useState('');

    // --- 核心修正：Firebase 專案 ID 鎖定 ---
    const DEFAULT_PROJECT_ID = "salonpos-system";
    
    // --- 區域狀態防止輸入時介面跳動 ---
    const [localShopID, setLocalShopID] = useState(settings.shopID || '');
    const [localSyncToken, setLocalSyncToken] = useState(settings.syncToken || '');

    // 當從雲端還原後，更新同步回輸入框
    useEffect(() => {
        setLocalShopID(settings.shopID || '');
        setLocalSyncToken(settings.syncToken || '');
    }, [settings.shopID, settings.syncToken]);

    // 儲存連動設定
    const saveCloudSettings = async () => {
        await setSettings(prev => ({
            ...prev,
            shopID: localShopID.trim(),
            cloudKey: DEFAULT_PROJECT_ID,
            syncToken: localSyncToken.trim()
        }));
    };

    // --- 修正：重新命名專屬函式，防止與全域 syncToCloud 衝突導致客資開單凍結 ---
    const handleSettingsBackup = async () => {
        const shopID = localShopID.trim();
        const syncToken = localSyncToken.trim();

        if (!shopID || !syncToken) {
            showToast("請輸入店號並生成金鑰", "error");
            return;
        }

        try {
            showToast(`正在連線並建立 [${shopID}] 空間...`, "loading");
            const url = `https://firestore.googleapis.com/v1/projects/${DEFAULT_PROJECT_ID}/databases/(default)/documents/SalonPOS/${shopID}/Tokens/${syncToken}?updateMask.fieldPaths=content`;
            
            const backupData = {
                fields: {
                    content: {
                        stringValue: JSON.stringify({
                            services: safeServices, 
                            stylists: safeStylists, 
                            customers: safeCustomers, 
                            transactions: safeTransactions, 
                            settings: { ...safeSettings, shopID, syncToken, cloudKey: DEFAULT_PROJECT_ID }, 
                            inventoryLogs: safeInventoryLogs, 
                            expenses: safeExpenses,
                            lastUpdated: new Date().toISOString()
                        })
                    }
                }
            };

            const response = await fetch(url, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(backupData)
            });

            if (response.ok) {
                saveCloudSettings();
                showToast(`✅ 店號 [${shopID}] 備份成功！`);
            } else {
                showToast("❌ 連線失敗，請檢查網路或專案權限", "error");
            }
        } catch (err) {
            showToast("❌ 雲端伺服器異常", "error");
        }
    };

    // --- 修正：重新命名專屬函式，防止全域變數崩潰 ---
    const handleSettingsRestore = async () => {
        const shopID = localShopID.trim();
        const syncToken = localSyncToken.trim();
        
        if (!shopID || !syncToken) {
            showToast("請填寫店號與金鑰", "error");
            return;
        }

        if (!confirm(`確定要從雲端還原 [${shopID}] 的資料嗎？`)) return;

        try {
            showToast("下載同步中...", "loading");
            const url = `https://firestore.googleapis.com/v1/projects/${DEFAULT_PROJECT_ID}/databases/(default)/documents/SalonPOS/${shopID}/Tokens/${syncToken}`;
            const response = await fetch(url);
            const result = await response.json();

            if (result && result.fields && result.fields.content) {
                const data = JSON.parse(result.fields.content.stringValue);
                if (data.services) setServices(data.services);
                if (data.stylists) setStylists(data.stylists);
                if (data.customers) setCustomers(data.customers);
                if (data.transactions) setTransactions(data.transactions);
                if (data.expenses) setExpenses(data.expenses);
                if (data.settings) setSettings(data.settings);
                if (data.inventoryLogs) setInventoryLogs(data.inventoryLogs);
                
                showToast("✅ 資料還原成功");
                setTimeout(() => window.location.reload(), 1000);
            } else {
                showToast("❌ 找不到資料，請確認店號是否正確", "error");
            }
        } catch (err) {
            showToast("讀取失敗", "error");
        }
    };

    const _addCategory = () => { if(categoryInput && !safeSettings.categories.includes(categoryInput)) { setSettings({...safeSettings, categories: [...safeSettings.categories, categoryInput]}); setCategoryInput(''); } };
    const _addExpenseType = () => { if(expenseTypeInput && !safeSettings.expenseTypes.includes(expenseTypeInput)) { setSettings({...safeSettings, expenseTypes: [...safeSettings.expenseTypes, expenseTypeInput]}); setExpenseTypeInput(''); } };
    const _removeCategory = (cat) => setSettings({...safeSettings, categories: safeSettings.categories.filter(c=>c!==cat)});
    const _removeExpenseType = (type) => setSettings({...safeSettings, expenseTypes: safeSettings.expenseTypes.filter(t=>t!==type)});
    
    const _exportBackup = () => {
        try {
            const backupData = { services: safeServices, stylists: safeStylists, customers: safeCustomers, transactions: safeTransactions, settings: safeSettings, inventoryLogs: safeInventoryLogs, expenses: safeExpenses };
            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a'); link.href = url; link.download = `salon_backup_${getCurrentDateLocal()}.json`; document.body.appendChild(link); link.click(); document.body.removeChild(link); URL.revokeObjectURL(url); showToast('備份下載已啟動');
        } catch (error) { console.error(error); alert('備份失敗'); }
    };

    const _importBackup = (event) => {
        const fileReader = new FileReader();
        if (!event.target.files[0]) return;
        fileReader.readAsText(event.target.files[0], "UTF-8");
        fileReader.onload = async (e) => {
            try {
                const parsed = JSON.parse(e.target.result);
                if (confirm('確定要「還原舊檔案」嗎？')) {
                    const dataMap = { 'salon_services': parsed.services || [], 'salon_stylists': parsed.stylists || [], 'salon_customers': parsed.customers || [], 'salon_transactions': parsed.transactions || [], 'salon_expenses': parsed.expenses || [], 'salon_settings': parsed.settings || {}, 'salon_inventory_logs': parsed.inventoryLogs || [] };
                    Object.entries(dataMap).forEach(([key, val]) => { localStorage.setItem(key, JSON.stringify(val)); });
                    alert('資料還原成功');
                    window.location.reload(); 
                }
            } catch (err) { alert('檔案讀取失敗'); }
        };
    }; 

    const handleSaveItem = () => {
        if (!itemForm.name || !itemForm.price) { alert('請輸入名稱與價格'); return; }
        const newItem = { ...itemForm, price: Number(itemForm.price), cost: Number(itemForm.cost || 0), stock: itemForm.isProduct ? (itemForm.stock !== null ? itemForm.stock : 0) : null };
        if (newItem.id) setServices(safeServices.map(s => s.id === newItem.id ? newItem : s));

    };

    const handleDeleteItem = (id) => {
        confirmAction('刪除項目', '確定刪除？', () => {
            setServices(safeServices.filter(s => s.id !== id)); showToast('項目已刪除');
        });
    };

    const filteredItemList = safeServices.filter(s => s.name.includes(itemSearch) || s.category.includes(itemSearch));

    return (
        <div className="p-6 md:p-10 h-full overflow-y-auto max-w-6xl mx-auto space-y-8 pb-32">

            <div className="card p-8 border-l-4 border-amber-500 shadow-md">
                <h3 className="font-bold text-xl mb-4 text-slate-800 flex items-center gap-2">
                    <Wifi size={24} className="text-amber-500"/> 雲端自動同步設定
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6 mb-6">
                    <div>
                        <label className="text-xs font-bold text-slate-500 mb-1 block uppercase">第一步：設定客戶店號 (Shop ID)</label>
                        <input 
                            className="input-field font-bold text-lg bg-white border-2 border-slate-200" 
                            placeholder="例如: SpecialSpace_A" 
                            value={localShopID} 
                            onChange={(e) => setLocalShopID(e.target.value)}
                        />
                        <p className="text-[10px] text-slate-400 mt-1">※ 相同店號的資料會存於同一個雲端資料夾</p>
                    </div>
                    <div>
                        <label className="text-xs font-bold text-slate-500 mb-1 block uppercase">第二步：手動輸入或生成同步金鑰 (Sync Token)</label>
                        <div className="flex gap-2">
                            <input 
                                className="input-field font-mono text-lg text-indigo-600 font-bold bg-white flex-1" 
                                placeholder="請輸入自訂金鑰密碼" 
                                value={localSyncToken} 
                                onChange={(e) => setLocalSyncToken(e.target.value)}
                            />
                            <button onClick={(e) => { e.preventDefault(); const t = Math.random().toString(36).substring(2, 10).toUpperCase(); setLocalSyncToken(t); }} className="btn btn-secondary whitespace-nowrap bg-slate-800 text-white">自動生成</button>
                        </div>
                    </div>
                </div>
                <div className="flex gap-4">
                    <button onClick={async()=>{try{await saveCloudSettings();showToast("連線設定已儲存，尚未傳送資料", "success");}catch(e){showToast("設定未儲存，請重新核對", "error");}}} className="btn btn-secondary">儲存連線設定</button><button onClick={handleSettingsBackup} className="btn btn-primary flex-1 py-4 font-bold shadow-lg text-lg">
                        <Upload size={20}/> 建立空間並備份
                    </button>
                    <button onClick={handleSettingsRestore} className="btn btn-secondary flex-1 py-4 font-bold text-lg">
                        <Download size={20}/> 下載恢復資料
                    </button>
                </div>
            </div>

            {/* 營業項目管理列表 */}
            <div className="card p-8">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div>
                        <h3 className="font-bold text-xl text-slate-800">營業項目管理</h3>
                        <p className="text-xs text-slate-400 mt-1">管理店內提供之洗剪染燙服務及販售之實體產品</p>
                    </div>
                    <div className="flex gap-2 w-full md:w-auto">
                        <div className="relative flex-1 md:w-48">
                            <Search className="absolute left-3 top-2.5 text-slate-400" size={18}/>
                            <input className="input-field pl-10 py-1.5 text-sm" placeholder="搜尋項目..." value={itemSearch} onChange={e=>setItemSearch(e.target.value)}/>
                        </div>
                        <button onClick={() => { setItemForm({ category: safeSettings.categories[0] || '', price: '', cost: '', isProduct: false }); setIsEditingItem(true); }} className="btn btn-primary text-sm whitespace-nowrap"><Plus size={16}/> 新增項目</button>
                    </div>
                </div>

                <div className="overflow-x-auto border rounded-xl">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 border-b text-slate-500 font-bold">
                            <tr>
                                <th className="p-4">項目名稱</th>
                                <th className="p-4">分類</th>
                                <th className="p-4 text-right">售價</th>
                                <th className="p-4 text-right">成本</th>
                                <th className="p-4 text-center">庫存管理</th>
                                <th className="p-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {filteredItemList.map(item => (
                                <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="p-4 font-bold text-slate-800">{item.name}</td>
                                    <td className="p-4"><span className="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-bold">{item.category}</span></td>
                                    <td className="p-4 text-right font-bold text-slate-700">${item.price}</td>
                                    <td className="p-4 text-right text-slate-500">${item.cost || 0}</td>
                                    <td className="p-4 text-center">{item.isProduct ? <span className="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-xs font-bold">啟用 (實體商品)</span> : <span className="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded text-xs font-bold">現場服務</span>}</td>
                                    <td className="p-4 text-center">
                                        <div className="flex justify-center gap-1">
                                            <button onClick={() => { setItemForm(item); setIsEditingItem(true); }} className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg"><Edit size={16}/></button>
                                            <button onClick={() => handleDeleteItem(item.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg"><Trash2 size={16}/></button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                            {filteredItemList.length === 0 && (
                                <tr><td colSpan="6" className="p-8 text-center text-slate-400">尚未建立任何服務 or 商品項目</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* 抽成規則 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">抽成規則</h3>
                <label className="flex items-center gap-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors">
                    <input type="checkbox" checked={safeSettings.deductCostBeforeCommission} onChange={e=>setSettings({...safeSettings, deductCostBeforeCommission:e.target.checked})} className="w-5 h-5 accent-indigo-600"/> 
                    <span className="font-bold text-slate-700">計算抽成前，先扣除商品或服務成本 (毛利抽成)</span>
                </label>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    {safeSettings.categories.map(c=>(
                        <div key={c} className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                            <div className="text-xs font-bold text-slate-400 mb-2">{c} (%)</div>
                            <input type="number" className="w-full bg-transparent font-black text-xl border-b border-slate-300 text-center outline-none" value={safeSettings.commissionRates[c]||0} onChange={e=>{const newRates={...safeSettings.commissionRates,[c]:Number(e.target.value)}; setSettings({...safeSettings, commissionRates:newRates})}}/>
                        </div>
                    ))}
                </div>
            </div>

            {/* 分類管理 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">分類管理</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 className="text-sm font-bold text-slate-500 mb-3">服務/商品分類</h4>
                        <div className="flex gap-3 mb-4">
                            <input type="text" className="input-field" placeholder="新分類名稱" value={categoryInput} onChange={e=>setCategoryInput(e.target.value)}/>
                            <button onClick={_addCategory} className="btn btn-secondary">新增</button>
                        </div>
                        <div className="flex flex-wrap gap-2">{safeSettings.categories.map(c=>(<span key={c} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 border border-slate-200">{c} <button onClick={()=>_removeCategory(c)} className="text-slate-400 hover:text-red-500"><X size={14}/></button></span>))}</div>
                    </div>
                    <div>
                        <h4 className="text-sm font-bold text-slate-500 mb-3">支出項目分類</h4>
                        <div className="flex gap-3 mb-4">
                            <input type="text" className="input-field" placeholder="新支出項目" value={expenseTypeInput} onChange={e=>setExpenseTypeInput(e.target.value)}/>
                            <button onClick={_addExpenseType} className="btn btn-secondary">新增</button>
                        </div>
                        <div className="flex flex-wrap gap-2">{safeSettings.expenseTypes.map(t=>(<span key={t} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 border border-slate-200">{t} <button onClick={()=>_removeExpenseType(t)} className="text-slate-400 hover:text-red-500"><X size={14}/></button></span>))}</div>
                    </div>
                </div>
            </div>

            {/* 系統維護 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">系統維護</h3>
                <div className="flex gap-4 flex-wrap">
                    <button onClick={_exportBackup} className="btn btn-primary"><Download size={18}/> 備份資料 (下載)</button>
                    <label className="btn btn-secondary cursor-pointer"><Upload size={18}/> 還原資料<input type="file" className="hidden" accept=".json" onChange={_importBackup}/></label>
                    <button onClick={() => confirmAction('重置系統', '這將清空所有資料！', () => { localStorage.clear(); window.location.reload(); })} className="btn btn-danger ml-auto"><RefreshCw size={18}/> 重置系統 (清空)</button>
                </div>
            </div>

            {/* 項目編輯彈窗 */}
            {isEditingItem && (
                <Modal title={itemForm.id ? '編輯項目' : '新增項目'} onClose={()=>setIsEditingItem(false)}>
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">名稱</label><input className="input-field shadow-sm bg-white" value={itemForm.name||''} onChange={e=>setItemForm({...itemForm, name: e.target.value})} placeholder="例如: 精緻洗髮"/></div>
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">分類</label><select className="input-field shadow-sm bg-white" value={itemForm.category} onChange={e=>setItemForm({...itemForm, category: e.target.value})}>{safeSettings.categories.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                        </div>
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">售價</label><input type="number" className="input-field shadow-sm bg-white" value={itemForm.price||0} onChange={e=>setItemForm({...itemForm, price: e.target.value})}/></div>
                            <div>
                                <label className="text-xs font-bold text-slate-500 mb-1 block">店家管銷成本率 (%)</label>
                                <input 
                                    type="number" 
                                    className="input-field shadow-sm bg-white" 
                                    value={itemForm.cost || 0} 
                                    onChange={e => setItemForm({...itemForm, cost: Number(e.target.value)})} 
                                    placeholder="例如: 20"
                                />
                            </div>
                        </div>
                        <div className="border-t pt-4 mt-2">
                            <label className="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                                <input type="checkbox" className="w-5 h-5 accent-indigo-600" checked={itemForm.isProduct||false} onChange={e=>setItemForm({...itemForm, isProduct: e.target.checked})}/>
                                <div><div className="font-bold text-slate-700">啟用庫存管理</div></div>
                            </label>
                        </div>
                        <button onClick={handleSaveItem} className="btn btn-primary w-full py-4 mt-2 shadow-md">儲存項目</button>
                    </div>
                </Modal>
            )}
        </div>
    );
};     
            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 z-20 shadow-sm">
                        <div className="p-6 hidden lg:flex flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">S</div><div className="font-bold text-lg text-slate-800">專屬空間沙龍</div></div>
                        <nav className="flex-1 p-4 space-y-2">
                            {[ {id:'pos', icon:CreditCard, label:'收銀開單'}, {id:'orders', icon:ClipboardList, label:'查單管理'}, {id:'booking-import', icon:ClipboardList, label:'待核對預約'}, {id:'report', icon:Activity, label:'營運報表'}, {id:'customers', icon:User, label:'顧客資料'}, {id:'staff', icon:UserCog, label:'人員管理'}, {id:'inventory', icon:Box, label:'商品庫存'}, {id:'settings', icon:Settings, label:'系統設定'} ].map(item=>(<button key={item.id} onClick={()=>setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold ${activeTab===item.id?'bg-indigo-50 text-indigo-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><item.icon size={20}/>{item.label}</button>))}
                        </nav>                 
                        <div className="p-4 border-t border-slate-100 text-xs text-center text-slate-400 font-medium">Salon POS v18.8 雲端待核對</div>
                    </aside>
                    
                    {/* 手機版全螢幕選單 */}
                    {isMobileMenuOpen && (
                        <div className="lg:hidden fixed inset-0 bg-slate-900/95 z-[100] pt-[env(safe-area-inset-top)] px-6 text-white animate-fade-in flex flex-col">
                            <div className="flex justify-between items-center py-6 border-b border-white/10">
                                <div className="font-bold text-xl">系統選單</div>
                                <button onClick={() => setIsMobileMenuOpen(false)} className="p-2"><X size={32}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto pt-4 pb-10">
                                {[ 
                                    {id:'pos', label:'開單'}, {id:'orders', label:'查單'}, {id:'booking-import', label:'待核對預約'}, {id:'report', label:'報表'}, 
                                    {id:'customers', label:'客資'}, {id:'staff', label:'人員'}, {id:'inventory', label:'庫存'}, {id:'settings', label:'設定'} 
                                ].map(item => (
                                    <button key={item.id} onClick={()=>{setActiveTab(item.id); setIsMobileMenuOpen(false);}} className="block text-2xl font-bold w-full text-left py-5 border-b border-white/5 active:bg-white/10">{item.label}</button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 主內容區 */}
                    <main className="flex-1 w-full h-screen overflow-hidden flex flex-col relative pt-[env(safe-area-inset-top)]">
                        {activeTab !== 'booking-import' && <BookingInboxNotice onOpen={()=>setActiveTab('booking-import')}/>} {/* 手機版頂欄 */}
                        <div className="lg:hidden bg-white border-b p-4 h-16 flex justify-between items-center z-30 shadow-sm">
                            <div className="font-bold flex items-center gap-2 text-slate-800">
                                <div className="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white">S</div> 專屬空間
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 bg-slate-100 rounded-lg active:bg-slate-200"><Menu size={24}/></button>
                        </div>

                        <div className="flex-1 overflow-auto bg-slate-50">
                            {activeTab === 'pos' && <POSView />}
                            {activeTab === 'orders' && <OrderView />}
                            {activeTab === 'booking-import' && <BookingImportView />}
                            {activeTab === 'report' && <ReportView />}
                            {activeTab === 'customers' && <CustomerView />}
                            {activeTab === 'staff' && <StaffView />}
                            {activeTab === 'inventory' && <InventoryView />}
                            {activeTab === 'settings' && <SettingsView />}
                        </div>
                    </main>

                    <ConfirmModal {...confirmDialog} />
                    {notification && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 px-6 py-3 rounded-2xl shadow-2xl z-[110] animate-fade-in text-white font-bold flex items-center gap-2 whitespace-nowrap ${notification.type==='error'?'bg-red-500':'bg-slate-800'}`}>
                            {notification.type==='error'?<X size={20}/>:<CheckCircle size={20}/>} {notification.msg}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        if(navigator.locks)navigator.locks.request('salon_transactions-write',()=>window.AetherPosBridge.recover()).then(()=>root.render(<HairSalonApp />)).catch(()=>{document.getElementById('root').textContent='資料復原未完成，請保留本機資料並聯絡支援。';});else if(localStorage.getItem(window.AetherPosBridge.PREFIX+'journal'))document.getElementById('root').textContent='請使用支援安全寫入的瀏覽器復原資料。';else root.render(<HairSalonApp />);
    </script>
</body>
</html>

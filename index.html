                } catch (e) { return defaultValue; }

                        // 優先讀取訂單上記錄的散客性別(customerGender)，如果找不到(代表舊會員訂單)，再去找會員資料夾裡的性別(gender)
                        const gender = t.customerGender || customer?.gender || '女'; 
                        const isVip = (customer?.totalSpend || 0) > 10000;
                                
                                 // 讀取自訂顏色
                                const themeKey = safeSettings.genderColors[gender] || 'slate';
                                const cardClass = getThemeClasses(themeKey, 'card_filled');

                                return (
                                    <div key={t.id} className={`card p-5 relative group transition-all border border-transparent hover:border-slate-300 ${cardClass}`}>
                                        {/* 卡片標頭 */}
                                        <div className="flex justify-between items-start mb-3 border-b border-black/5 pb-2">
                                            <div>
                                                <div className="text-sm font-bold text-slate-800">{new Date(t.date).toLocaleDateString()}</div>
                                                <div className="text-xs text-slate-500 font-mono">{new Date(t.date).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})}</div>
                                            </div>
                                            <div className="text-right">
                                                <div className="text-xs text-slate-400 font-mono">#{t.id.slice(0,6)}</div>
                                                {isVip && <span className="text-sm" title="VIP客戶">👑</span>}
                                            </div>
                                        </div>

                                        {/* 卡片主體 */}
                                        <div className="flex justify-between items-center mb-3">
                                            <div>
                                                <div className="font-black text-lg text-slate-900 flex items-center gap-1">
                                                    {t.customerName}
                                                    <span className="text-[10px] bg-white/50 px-1.5 rounded text-slate-600 border border-slate-200">{gender}</span>
                                                </div>
                                                <div className="text-xs text-slate-600 flex items-center gap-1">
                                                    <User size={10}/> {safeStylists.find(s=>s.id===t.mainStylistId)?.name || '未指定'}
                                                </div>
                                            </div>
                                            <div className="text-right">
                                                <div className="font-black text-xl text-slate-800">{formatCurrency(t.total)}</div>
                                                <span className="text-[10px] bg-white/80 px-1.5 py-0.5 rounded text-slate-600 border border-slate-200">{t.paymentMethod}</span>
                                            </div>
                                        </div>

                                        {/* 服務標籤 (套用分類顏色) */}
                                        <div className="flex flex-wrap gap-1 mb-1">
                                            {(t.items||[]).map((i, idx) => {
                                                const catThemeKey = safeSettings.categoryColors[i.category] || 'slate';
                                                const catBadgeClass = getThemeClasses(catThemeKey, 'badge');
                                                return (
                                                    <span key={idx} className={`text-[10px] px-2 py-1 rounded font-bold border border-black/5 ${catBadgeClass}`}>
                                                        {i.name}
                                                    </span>
                                                );
                                            })}
                                        </div>

                                        {/* 懸浮按鈕 */}
                                        <div className="absolute top-4 right-4 flex gap-2 opacity-0 group-hover:opacity-100 transition-opacity bg-white/90 p-1.5 rounded-lg shadow-sm backdrop-blur-sm border border-slate-100">
                                            <button onClick={()=>setEditingOrder(t)} className="p-1.5 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg transition-all" title="編輯"><Edit size={16}/></button>
                                            <button onClick={()=>handleDeleteOrder(t.id)} className="p-1.5 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg transition-all" title="刪除"><Trash2 size={16}/></button>
                                        </div>
                                    </div>
                                );
                            })}
                        </div>
                        
                        {filteredOrders.length === 0 && (
                            <div className="text-center py-20 bg-white rounded-xl border border-dashed text-slate-400 flex flex-col items-center gap-2">
                                <ClipboardList size={40} className="opacity-20"/>
                                <span>查無訂單資料</span>
                            </div>
                        )}

                        {editingOrder && <EditOrderModal order={editingOrder} onClose={()=>setEditingOrder(null)} onSave={handleUpdateOrder}/>}
                    </div>
                );
            };

            // --- Report View ---
            const ReportView = () => {
                const [view, setView] = useState('dashboard');
                const [reportMode, setReportMode] = useState('month'); 
                const [queryDate, setQueryDate] = useState(getCurrentDateLocal().slice(0, 7)); // Default YYYY-MM
                const [newExpense, setNewExpense] = useState({ date: getCurrentDateLocal(), type: '雜支', amount: '', note: '', staffId: '' });
                const [showExpenseModal, setShowExpenseModal] = useState(false);

                const handleModeChange = (mode) => {
                    setReportMode(mode);
                    const now = getCurrentDateLocal();
                    if (mode === 'day') setQueryDate(now);
                    else if (mode === 'month') setQueryDate(now.slice(0, 7));
                    else if (mode === 'year') setQueryDate(now.slice(0, 4));
                };

                const reportTx = useMemo(() => {
                    return safeTransactions.filter(t => {
                        if (!t.date) return false;
                        const d = t.date;
                        if (reportMode === 'day') return d.startsWith(queryDate);
                        if (reportMode === 'month') return d.startsWith(queryDate);
                        if (reportMode === 'year') return d.startsWith(queryDate);
                        return false;
                    });
                }, [safeTransactions, queryDate, reportMode]);

                const reportExp = useMemo(() => {
                    return safeExpenses.filter(e => {
                        if (!e.date) return false;
                        if (reportMode === 'day') return e.date === queryDate;
                        if (reportMode === 'month') return e.date.startsWith(queryDate);
                        if (reportMode === 'year') return e.date.startsWith(queryDate);
                        return false;
                    });
                }, [safeExpenses, queryDate, reportMode]);

                const totalRevenue = reportTx.reduce((sum, t) => sum + (Number(t.total) || 0), 0);
                const totalExpense = reportExp.reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
                const netProfit = totalRevenue - totalExpense;
                const totalOrders = reportTx.length;
                const avgOrderValue = totalOrders > 0 ? Math.round(totalRevenue / totalOrders) : 0;

                const paymentMethodStats = useMemo(() => {
                    const stats = {};
                    reportTx.forEach(t => {
                        const method = t.paymentMethod || '其他';
                        if (!stats[method]) stats[method] = 0;
                        stats[method] += t.total;
                    });
                    return stats;
                }, [reportTx]);

              const salaryReport = useMemo(() => {
    return safeStylists.map(s => {
        let serviceRevenue = 0, productRevenue = 0, serviceCommission = 0, productCommission = 0;
        
        reportTx.forEach(t => {
            (t.items || []).forEach(item => {
                if (item.stylistId === s.id) {
                    const amount = (Number(item.price) || 0) - (Number(item.discount) || 0); // 實收金額 (售價 - 折扣)
                    
                    // --- 完美抽成核心邏輯 ---
                    let base = amount;
                    if (safeSettings.deductCostBeforeCommission) {
                        // 將 item.cost 視為百分比 (例如 20 代表 20%)
                        const costRate = Number(item.cost) || 0;
                        const itemCost = amount * (costRate / 100); // 計算出該項目的店家管銷成本
                        base = amount - itemCost; // 扣除成本後的「業績毛利底數」
                    }
                    
                    // 取得該項目分類的特定抽成率 (例如剪髮 40%、洗髮 30%)
                    let rate = s.useGlobalCommission ? (safeSettings.commissionRates[item.category] || 0) : (s.commissionRate || 0);
                    
                    // 計算該項目設計師實得抽成
                    const comm = Math.round(base * (rate / 100));
                    
                    if (item.isProduct) { 
                        productRevenue += amount; 
                        productCommission += comm; 
                    } else { 
                        serviceRevenue += amount; 
                        serviceCommission += comm; 
                    }
                }
            });
        });
        
        const advanceTotal = reportExp.filter(e => e.type === '員工借支' && e.relatedStaffId === s.id).reduce((sum, e) => sum + (Number(e.amount) || 0), 0);
        const totalSalary = (Number(s.baseSalary)||0) + (Number(s.positionBonus)||0) + (Number(s.attendanceBonus)||0) + serviceCommission + productCommission - advanceTotal;
        return { ...s, serviceRevenue, productRevenue, totalCommission: serviceCommission+productCommission, advanceTotal, totalSalary };
    });
}, [reportTx, reportExp, safeStylists, safeSettings]);

                const categoryCountReport = useMemo(() => {
                    return safeStylists.map(s => {
                        const counts = {};
                        safeSettings.categories.forEach(c => counts[c] = 0);
                        let totalCount = 0;
                        reportTx.forEach(t => {
                            (t.items || []).forEach(i => {
                                if (i.stylistId === s.id) {
                                    if (counts[i.category] !== undefined) { counts[i.category]++; totalCount++; }
                                }
                            });
                        });
                        return { ...s, counts, totalCount };
                    });
                }, [reportTx, safeStylists, safeSettings]);

                const addExpense = () => {
                    if(!newExpense.amount) return;
                    setExpenses([...safeExpenses, { id: generateId(), ...newExpense }]);
                    setShowExpenseModal(false); setNewExpense({ date: getCurrentDateLocal(), type: '雜支', amount: '', note: '', staffId: '' });
                    showToast('支出已記錄');
                };

                return (
                    <div className="p-4 md:p-8 h-full overflow-y-auto">
                        <div className="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                            <div className="flex bg-white p-1.5 rounded-xl shadow-sm border border-slate-200">
                                {[{id:'dashboard', icon:Activity, label:'營運儀表'}, {id:'salary', icon:User, label:'人員薪資'}, {id:'expense', icon:DollarSign, label:'支出管理'}].map(tab => (
                                    <button key={tab.id} onClick={()=>setView(tab.id)} className={`px-5 py-2.5 rounded-lg font-bold flex items-center gap-2 transition-all ${view===tab.id ? 'bg-slate-800 text-white shadow-md' : 'text-slate-500 hover:bg-slate-50'}`}>
                                        <tab.icon size={18}/> {tab.label}
                                    </button>
                                ))}
                            </div>
                            <div className="flex items-center gap-3 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-200">
                                <div className="flex gap-1 border-r pr-3 mr-2">
                                    <button onClick={()=>handleModeChange('day')} className={`px-2 py-1 text-xs rounded font-bold ${reportMode==='day'?'bg-indigo-100 text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>日報</button>
                                    <button onClick={()=>handleModeChange('month')} className={`px-2 py-1 text-xs rounded font-bold ${reportMode==='month'?'bg-indigo-100 text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>月報</button>
                                    <button onClick={()=>handleModeChange('year')} className={`px-2 py-1 text-xs rounded font-bold ${reportMode==='year'?'bg-indigo-100 text-indigo-600':'text-slate-400 hover:text-slate-600'}`}>年報</button>
                                </div>
                                <span className="text-slate-400 font-bold text-sm">查詢時間</span>
                                {reportMode === 'day' && <input type="date" className="bg-transparent font-bold text-slate-700 outline-none w-32" value={queryDate} onChange={e=>setQueryDate(e.target.value)}/>}
                                {reportMode === 'month' && <input type="month" className="bg-transparent font-bold text-slate-700 outline-none" value={queryDate} onChange={e=>setQueryDate(e.target.value)}/>}
                                {reportMode === 'year' && <input type="number" min="2020" max="2050" className="bg-transparent font-bold text-slate-700 outline-none w-20" value={queryDate} onChange={e=>setQueryDate(e.target.value)}/>}
                            </div>
                        </div>

                        {view === 'dashboard' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                                    <StatCard title={`${reportMode==='year'?'本年':reportMode==='month'?'本月':'本日'}總營收`} value={formatCurrency(totalRevenue)} icon={TrendingUp} colorClass="border-indigo-500" />
                                    <StatCard title={`${reportMode==='year'?'本年':reportMode==='month'?'本月':'本日'}總支出`} value={formatCurrency(totalExpense)} icon={Wallet} colorClass="border-rose-500" />
                                    <StatCard title="淨利 (Net Profit)" value={formatCurrency(netProfit)} subValue={`淨利率: ${totalRevenue>0?((netProfit/totalRevenue)*100).toFixed(1):0}%`} icon={DollarSign} colorClass={netProfit>=0?"border-emerald-500":"border-red-500"} />
                                    <StatCard title="總來客數 (單)" value={totalOrders} subValue={`平均客單: ${formatCurrency(avgOrderValue)}`} icon={User} colorClass="border-amber-500" />
                                </div>
                                <div className="grid grid-cols-1 lg:grid-cols-3 gap-8">
                                    <div className="card p-6">
                                        <h3 className="font-bold text-lg mb-6 text-slate-800 flex items-center gap-2"><Scissors size={20} className="text-indigo-500"/> 服務項目營收佔比</h3>
                                        <div className="space-y-5">
                                            {safeSettings.categories.map(cat => {
                                                const catTotal = reportTx.reduce((sum, t) => sum + (t.items||[]).filter(i=>i.category===cat).reduce((s,i)=>s+(i.price-(i.discount||0)),0), 0);
                                                const percent = totalRevenue > 0 ? (catTotal / totalRevenue) * 100 : 0;
                                                if (percent === 0) return null;
                                                
                                                // 使用自訂顏色
                                                const themeKey = safeSettings.categoryColors[cat] || 'slate';
                                                const fillColor = getThemeClasses(themeKey, 'fill') || '#6366f1';

                                                return (<div key={cat}><div className="flex justify-between text-sm mb-2 font-bold text-slate-600"><span>{cat}</span><span>{formatCurrency(catTotal)} ({percent.toFixed(1)}%)</span></div><div className="bar-container"><div className="bar-fill" style={{width: `${percent}%`, backgroundColor: fillColor}}></div></div></div>);
                                            })}
                                        </div>
                                    </div>
                                    <div className="card p-6">
                                        <h3 className="font-bold text-lg mb-6 text-slate-800 flex items-center gap-2"><CreditCard size={20} className="text-emerald-500"/> 收款方式分析</h3>
                                        <div className="space-y-5">
                                            {Object.entries(paymentMethodStats).map(([method, amount]) => {
                                                const percent = totalRevenue > 0 ? (amount / totalRevenue) * 100 : 0;
                                                return (<div key={method}><div className="flex justify-between text-sm mb-2 font-bold text-slate-600"><span className="flex items-center gap-2">{method}</span><span>{formatCurrency(amount)} ({percent.toFixed(1)}%)</span></div><div className="bar-container"><div className="bar-fill bg-emerald-500" style={{width: `${percent}%`}}></div></div></div>);
                                            })}
                                            {Object.keys(paymentMethodStats).length === 0 && <div className="text-center text-slate-400 py-10">尚無收款紀錄</div>}
                                        </div>
                                    </div>
                                    <div className="card p-6">
                                        <h3 className="font-bold text-lg mb-6 text-slate-800 flex items-center gap-2"><Briefcase size={20} className="text-rose-500"/> 支出結構分析</h3>
                                        <div className="space-y-5">
                                            {safeSettings.expenseTypes.map(type => {
                                                const typeTotal = reportExp.filter(e => e.type === type).reduce((sum, e) => sum + (Number(e.amount)||0), 0);
                                                const percent = totalExpense > 0 ? (typeTotal / totalExpense) * 100 : 0;
                                                if (typeTotal === 0) return null;
                                                return (<div key={type}><div className="flex justify-between text-sm mb-2 font-bold text-slate-600"><span>{type}</span><span>{formatCurrency(typeTotal)} ({percent.toFixed(1)}%)</span></div><div className="bar-container"><div className="bar-fill bg-rose-500" style={{width: `${percent}%`}}></div></div></div>);
                                            })}
                                            {reportExp.length === 0 && <div className="text-center text-slate-400 py-10">尚無支出紀錄</div>}
                                        </div>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'salary' && (
                            <div className="space-y-8 animate-fade-in">
                                <div className="card overflow-hidden">
                                    <div className="p-4 border-b bg-slate-50 font-bold text-slate-700">薪資結算表 ({reportMode==='year'?'年度':reportMode==='month'?'月度':'當日'})</div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase tracking-wider font-bold">
                                                <tr><th className="p-5 sticky left-0 bg-white">設計師</th><th className="p-5 text-right">技術業績</th><th className="p-5 text-right">販賣業績</th><th className="p-5 text-right text-indigo-600">抽成總額</th><th className="p-5 text-right">底薪+津貼</th><th className="p-5 text-right text-rose-500">借支扣款</th><th className="p-5 text-right font-black bg-indigo-50/50">實領薪資</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {salaryReport.map(s => (<tr key={s.id} className="hover:bg-slate-50 transition-colors"><td className="p-5 font-bold text-slate-800 sticky left-0 bg-white">{s.name} <span className="text-xs font-normal text-slate-400 bg-slate-100 px-2 py-0.5 rounded-full ml-2">{s.role}</span></td><td className="p-5 text-right text-slate-600">{formatCurrency(s.serviceRevenue)}</td><td className="p-5 text-right text-slate-600">{formatCurrency(s.productRevenue)}</td><td className="p-5 text-right font-bold text-indigo-600">{formatCurrency(s.totalCommission)}</td><td className="p-5 text-right text-slate-600">{formatCurrency((s.baseSalary||0) + (s.bonuses||0))}</td><td className="p-5 text-right text-rose-500 font-bold">-{formatCurrency(s.advanceTotal)}</td><td className="p-5 text-right font-black text-lg bg-indigo-50/30 text-slate-800">{formatCurrency(s.totalSalary)}</td></tr>))}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div className="p-4 bg-slate-50 text-xs text-slate-500 text-center border-t">* 薪資計算公式: (底薪 + 津貼) + (各類業績 x 抽成比率) - 借支 <br/>* 當前設定: {safeSettings.deductCostBeforeCommission ? '抽成前已扣除商品成本' : '以銷售全額計算抽成'}</div>
                                </div>
                                <div className="card overflow-hidden">
                                    <div className="p-4 border-b bg-slate-50 font-bold text-slate-700 flex items-center gap-2"><Table size={18}/> 設計師服務客次交叉分析</div>
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left text-sm whitespace-nowrap">
                                            <thead className="bg-white border-b border-slate-200 text-slate-500 uppercase tracking-wider font-bold">
                                                <tr><th className="p-4 sticky left-0 bg-white min-w-[120px]">設計師</th>{safeSettings.categories.map(c => <th key={c} className="p-4 text-center">{c}</th>)}<th className="p-4 text-center font-black bg-indigo-50/30">總客次</th></tr>
                                            </thead>
                                            <tbody className="divide-y divide-slate-100">
                                                {categoryCountReport.map(s => (<tr key={s.id} className="hover:bg-slate-50 transition-colors"><td className="p-4 font-bold text-slate-800 sticky left-0 bg-white border-r">{s.name}</td>{safeSettings.categories.map(c => (<td key={c} className="p-4 text-center text-slate-600">{s.counts[c] > 0 ? <span className="bg-slate-100 px-2 py-1 rounded font-bold">{s.counts[c]}</span> : '-'}</td>))}<td className="p-4 text-center font-black text-indigo-600 bg-indigo-50/30">{s.totalCount}</td></tr>))}
                                            </tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        )}

                        {view === 'expense' && (
                            <div className="space-y-6 animate-fade-in">
                                <div className="flex justify-between items-center bg-white p-4 rounded-xl shadow-sm border">
                                    <div className="font-bold text-slate-500">{reportMode==='year'?'本年':reportMode==='month'?'本月':'本日'}支出總計: <span className="text-2xl text-slate-800 ml-2">{formatCurrency(totalExpense)}</span></div>
                                    <button onClick={()=>setShowExpenseModal(true)} className="btn btn-primary"><Plus size={18}/> 新增支出</button>
                                </div>
                                <div className="card overflow-hidden">
                                    <table className="w-full text-left text-sm">
                                        <thead className="bg-slate-50 border-b"><tr><th className="p-4">日期</th><th className="p-4">項目</th><th className="p-4">說明</th><th className="p-4 text-right">金額</th><th className="p-4 text-center">操作</th></tr></thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {reportExp.map(e => (
                                                <tr key={e.id} className="hover:bg-slate-50">
                                                    <td className="p-4 text-slate-500 font-mono">{e.date}</td>
                                                    <td className="p-4 font-bold text-slate-700"><span className={`inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full text-xs ${e.type==='員工借支'?'bg-rose-100 text-rose-700':'bg-slate-100 text-slate-700'}`}>{e.type==='員工借支' && <Wallet size={12}/>} {e.type}</span></td>
                                                    <td className="p-4 text-slate-600">{e.note} {e.relatedStaffId && <span className="bg-indigo-50 text-indigo-600 px-2 py-0.5 rounded text-xs font-bold ml-1">{safeStylists.find(s=>s.id===e.relatedStaffId)?.name}</span>}</td>
                                                    <td className="p-4 text-right font-bold text-rose-600">{formatCurrency(e.amount)}</td>
                                                    <td className="p-4 text-center"><button onClick={()=>confirmAction('刪除支出', '確定刪除此筆紀錄？', ()=>setExpenses(safeExpenses.filter(x=>x.id!==e.id)))} className="text-slate-300 hover:text-rose-500 p-2 transition-colors"><Trash2 size={16}/></button></td>
                                                </tr>
                                            ))}
                                            {reportExp.length === 0 && <tr><td colSpan="5" className="p-8 text-center text-slate-400">尚無支出紀錄</td></tr>}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        )}

                        {showExpenseModal && (
                            <Modal title="新增支出紀錄" onClose={()=>setShowExpenseModal(false)}>
                                <div className="space-y-4">
                                    <input type="date" className="input-field" value={newExpense.date} onChange={e=>setNewExpense({...newExpense, date: e.target.value})}/>
                                    <div><label className="text-xs font-bold text-slate-500 mb-2 block">支出類別</label><div className="grid grid-cols-2 gap-2">{safeSettings.expenseTypes.map(t=>(<button key={t} onClick={()=>setNewExpense({...newExpense, type:t, staffId: t!=='員工借支'?'':newExpense.staffId})} className={`py-2.5 rounded-lg text-sm font-bold border transition-all ${newExpense.type===t?'bg-rose-500 text-white border-rose-500 shadow-md':'bg-white text-slate-600 border-slate-200 hover:bg-slate-50'}`}>{t}</button>))}</div></div>
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">金額</label><input type="number" className="input-field text-lg font-bold" placeholder="0" value={newExpense.amount} onChange={e=>setNewExpense({...newExpense, amount: e.target.value})}/></div>
                                    <div><label className="text-xs font-bold text-slate-500 mb-1 block">備註說明</label><input className="input-field" placeholder="例如: 購買飲料、預支薪水..." value={newExpense.note} onChange={e=>setNewExpense({...newExpense, note: e.target.value})}/></div>

    const DEFAULT_PROJECT_ID = "salonpos-system";
    // --- 區域狀態防止輸入時介面跳動 ---
    const [localShopID, setLocalShopID] = useState(settings.shopID || '');
    const [localSyncToken, setLocalSyncToken] = useState(settings.syncToken || '');

    // 當從雲端還原後，更新同步回輸入框
    useEffect(() => {
        setLocalShopID(settings.shopID || '');
        setLocalSyncToken(settings.syncToken || '');
    }, [settings.shopID, settings.syncToken]);

    // 儲存連動設定
    const saveCloudSettings = () => {
        setSettings(prev => ({
            ...prev,
            shopID: localShopID.trim(),
            cloudKey: DEFAULT_PROJECT_ID,
            syncToken: localSyncToken.trim()
        }));
    };

    // --- 雲端備份邏輯：自動根據「店號」建立路徑 ---
    const syncToCloud = async () => {
        const shopID = localShopID.trim();
        const syncToken = localSyncToken.trim();

        if (!shopID || !syncToken) {
            showToast("請輸入店號並生成金鑰", "error");
            return;
        }

        try {
            showToast(`正在連線並建立 [${shopID}] 空間...`, "loading");
            const url = `https://firestore.googleapis.com/v1/projects/${DEFAULT_PROJECT_ID}/databases/(default)/documents/SalonPOS/${shopID}/Tokens/${syncToken}?updateMask.fieldPaths=content`;
            
            const backupData = {
                fields: {
                    content: {
                        stringValue: JSON.stringify({
                            services: safeServices, 
                            stylists: safeStylists, 
                            customers: safeCustomers, 
                            transactions: safeTransactions, 
                            settings: { ...safeSettings, shopID, syncToken, cloudKey: DEFAULT_PROJECT_ID }, 
                            inventoryLogs: safeInventoryLogs, 
                            expenses: safeExpenses,
                            lastUpdated: new Date().toISOString()
                        })
                    }
                }
            };

            const response = await fetch(url, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(backupData)
            });

            if (response.ok) {
                saveCloudSettings();
                showToast(`✅ 店號 [${shopID}] 備份成功！`);
            } else {
                showToast("❌ 連線失敗，請檢查網路或專案權限", "error");
            }

            showToast("❌ 雲端伺服器異常", "error");
        }
    };

    const syncFromCloud = async () => {
        const shopID = localShopID.trim();
        const syncToken = localSyncToken.trim();
        
        if (!shopID || !syncToken) {
            showToast("請填寫店號與金鑰", "error");
            return;
        }

        if (!confirm(`確定要從雲端還原 [${shopID}] 的資料嗎？`)) return;

        try {
            showToast("下載同步中...", "loading");
            const url = `https://firestore.googleapis.com/v1/projects/${DEFAULT_PROJECT_ID}/databases/(default)/documents/SalonPOS/${shopID}/Tokens/${syncToken}`;
            const response = await fetch(url);
            const result = await response.json();

            if (result && result.fields && result.fields.content) {
                const data = JSON.parse(result.fields.content.stringValue);
                if (data.services) setServices(data.services);
                if (data.stylists) setStylists(data.stylists);
                if (data.customers) setCustomers(data.customers);
                if (data.transactions) setTransactions(data.transactions);
                if (data.expenses) setExpenses(data.expenses);
                if (data.settings) setSettings(data.settings);
                if (data.inventoryLogs) setInventoryLogs(data.inventoryLogs);
                
                showToast("✅ 資料還原成功");
                setTimeout(() => window.location.reload(), 1000);
            } else {
                showToast("❌ 找不到資料，請確認店號是否正確", "error");

            const blob = new Blob([JSON.stringify(backupData, null, 2)], { type: 'application/json' });

                            onChange={(e) => setLocalShopID(e.target.value)}
                        />
                        <p className="text-[10px] text-slate-400 mt-1">※ 相同店號的資料會存於同一個雲端資料夾</p>
                    </div>
                    <div>
                        <label className="text-xs font-bold text-slate-500 mb-1 block uppercase">第二步：手動輸入或生成同步金鑰 (Sync Token)</label>
                        <div className="flex gap-2">
                       <input 
                            className="input-field font-mono text-lg text-indigo-600 font-bold bg-white flex-1" 
                            placeholder="請輸入自訂金鑰密碼" 
                            value={localSyncToken} 
                            onChange={(e) => setLocalSyncToken(e.target.value)}
                        />
                             <button onClick={(e) => { e.preventDefault(); const t = Math.random().toString(36).substring(2, 10).toUpperCase(); setLocalSyncToken(t); }} className="btn btn-secondary whitespace-nowrap bg-slate-800 text-white">自動生成</button>
                        </div>                   
                    </div>
                </div>
                <div className="flex gap-4">
                    <button onClick={syncToCloud} className="btn btn-primary flex-1 py-4 font-bold shadow-lg text-lg">
                        <Upload size={20}/> 建立空間並備份
                    </button>
                    <button onClick={syncFromCloud} className="btn btn-secondary flex-1 py-4 font-bold text-lg">
                        <Download size={20}/> 下載恢復資料
                    </button>
                </div>
            </div>

            {/* 新增：營業項目管理列表（讓原本沒標題沒列表的代碼重獲新生） */}
            <div className="card p-8">
                <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-6">
                    <div>
                        <h3 className="font-bold text-xl text-slate-800">營業項目管理</h3>
                        <p className="text-xs text-slate-400 mt-1">管理店內提供之洗剪染燙服務及販售之實體產品</p>
                    </div>
                    <div className="flex gap-2 w-full md:w-auto">
                        <div className="relative flex-1 md:w-48">
                            <Search className="absolute left-3 top-2.5 text-slate-400" size={18}/>
                            <input className="input-field pl-10 py-1.5 text-sm" placeholder="搜尋項目..." value={itemSearch} onChange={e=>setItemSearch(e.target.value)}/>
                        </div>
                        <button onClick={() => { setItemForm({ category: safeSettings.categories[0] || '', price: '', cost: '', isProduct: false }); setIsEditingItem(true); }} className="btn btn-primary text-sm whitespace-nowrap"><Plus size={16}/> 新增項目</button>
                    </div>
                </div>

                <div className="overflow-x-auto border rounded-xl">
                    <table className="w-full text-left text-sm whitespace-nowrap">
                        <thead className="bg-slate-50 border-b text-slate-500 font-bold">
                            <tr>
                                <th className="p-4">項目名稱</th>
                                <th className="p-4">分類</th>
                                <th className="p-4 text-right">售價</th>
                                <th className="p-4 text-right">成本</th>
                                <th className="p-4 text-center">庫存管理</th>
                                <th className="p-4 text-center">操作</th>
                            </tr>
                        </thead>
                        <tbody className="divide-y divide-slate-100">
                            {filteredItemList.map(item => (
                                <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                                    <td className="p-4 font-bold text-slate-800">{item.name}</td>
                                    <td className="p-4"><span className="bg-slate-100 text-slate-600 text-xs px-2.5 py-1 rounded-full font-bold">{item.category}</span></td>
                                    <td className="p-4 text-right font-bold text-slate-700">${item.price}</td>
                                    <td className="p-4 text-right text-slate-500">${item.cost || 0}</td>
                                    <td className="p-4 text-center">{item.isProduct ? <span className="text-emerald-600 bg-emerald-50 px-2 py-0.5 rounded text-xs font-bold">啟用 (實體商品)</span> : <span className="text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded text-xs font-bold">現場服務</span>}</td>
                                    <td className="p-4 text-center">
                                        <div className="flex justify-center gap-1">
                                            <button onClick={() => { setItemForm(item); setIsEditingItem(true); }} className="p-2 text-slate-400 hover:text-indigo-600 hover:bg-indigo-50 rounded-lg"><Edit size={16}/></button>
                                            <button onClick={() => handleDeleteItem(item.id)} className="p-2 text-slate-400 hover:text-red-500 hover:bg-red-50 rounded-lg"><Trash2 size={16}/></button>
                                        </div>
                                    </td>
                                </tr>
                            ))}
                            {filteredItemList.length === 0 && (
                                <tr><td colSpan="6" className="p-8 text-center text-slate-400">尚未建立任何服務或商品項目</td></tr>
                            )}
                        </tbody>
                    </table>
                </div>
            </div>

            {/* 抽成規則 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">抽成規則</h3>
                <label className="flex items-center gap-3 mb-6 bg-slate-50 p-4 rounded-xl border border-slate-200 cursor-pointer hover:bg-slate-100 transition-colors">
                    <input type="checkbox" checked={safeSettings.deductCostBeforeCommission} onChange={e=>setSettings({...safeSettings, deductCostBeforeCommission:e.target.checked})} className="w-5 h-5 accent-indigo-600"/> 
                    <span className="font-bold text-slate-700">計算抽成前，先扣除商品或服務成本 (毛利抽成)</span>
                </label>
                <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                    {safeSettings.categories.map(c=>(
                        <div key={c} className="p-4 bg-slate-50 rounded-xl border border-slate-200">
                            <div className="text-xs font-bold text-slate-400 mb-2">{c} (%)</div>
                            <input type="number" className="w-full bg-transparent font-black text-xl border-b border-slate-300 text-center outline-none" value={safeSettings.commissionRates[c]||0} onChange={e=>{const newRates={...safeSettings.commissionRates,[c]:Number(e.target.value)}; setSettings({...safeSettings, commissionRates:newRates})}}/>
                        </div>
                    ))}
                </div>
            </div>

            {/* 分類管理 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">分類管理</h3>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                    <div>
                        <h4 className="text-sm font-bold text-slate-500 mb-3">服務/商品分類</h4>
                        <div className="flex gap-3 mb-4">
<input type="text" className="input-field" placeholder="新分類名稱" value={categoryInput} onChange={e=>setCategoryInput(e.target.value)}/>                            <button onClick={addCategory} className="btn btn-secondary">新增</button>
                        </div>
                        <div className="flex flex-wrap gap-2">{safeSettings.categories.map(c=>(<span key={c} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 border border-slate-200">{c} <button onClick={()=>removeCategory(c)} className="text-slate-400 hover:text-red-500"><X size={14}/></button></span>))}</div>
                    </div>
                    <div>
                        <h4 className="text-sm font-bold text-slate-500 mb-3">支出項目分類</h4>
                        <div className="flex gap-3 mb-4">
<input type="text" className="input-field" placeholder="新支出項目" value={expenseTypeInput} onChange={e=>setExpenseTypeInput(e.target.value)}/>                            <button onClick={addExpenseType} className="btn btn-secondary">新增</button>
                        </div>
                        <div className="flex flex-wrap gap-2">{safeSettings.expenseTypes.map(t=>(<span key={t} className="bg-slate-100 px-3 py-1.5 rounded-lg text-sm font-bold flex items-center gap-2 border border-slate-200">{t} <button onClick={()=>removeExpenseType(t)} className="text-slate-400 hover:text-red-500"><X size={14}/></button></span>))}</div>
                    </div>
                </div>
            </div>

            {/* 系統維護 */}
            <div className="card p-8">
                <h3 className="font-bold text-xl mb-6 text-slate-800">系統維護</h3>
                <div className="flex gap-4 flex-wrap">
                    <button onClick={exportBackup} className="btn btn-primary"><Download size={18}/> 備份資料 (下載)</button>
                    <label className="btn btn-secondary cursor-pointer"><Upload size={18}/> 還原資料<input type="file" className="hidden" accept=".json" onChange={importBackup}/></label>
                    <button onClick={() => confirmAction('重置系統', '這將清空所有資料！', () => { localStorage.clear(); window.location.reload(); })} className="btn btn-danger ml-auto"><RefreshCw size={18}/> 重置系統 (清空)</button>
                </div>
            </div>

            {/* 項目彈出視窗（只在點擊編輯/新增時浮現在正中央） */}
            {isEditingItem && (
                <Modal title={itemForm.id ? '編輯項目' : '新增項目'} onClose={()=>setIsEditingItem(false)}>
                    <div className="space-y-4">
                        <div className="grid grid-cols-2 gap-4">
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">名稱</label><input className="input-field shadow-sm bg-white" value={itemForm.name||''} onChange={e=>setItemForm({...itemForm, name: e.target.value})} placeholder="例如: 洗髮精"/></div>
                            <div><label className="text-xs font-bold text-slate-500 mb-1 block">分類</label><select className="input-field shadow-sm bg-white" value={itemForm.category} onChange={e=>setItemForm({...itemForm, category: e.target.value})}>{safeSettings.categories.map(c=><option key={c} value={c}>{c}</option>)}</select></div>
                        </div>
                       <div className="grid grid-cols-2 gap-4">
    <div><label className="text-xs font-bold text-slate-500 mb-1 block">售價</label><input type="number" className="input-field shadow-sm bg-white" value={itemForm.price||0} onChange={e=>setItemForm({...itemForm, price: e.target.value})}/></div>
    <div>
        <label className="text-xs font-bold text-slate-500 mb-1 block">店家管銷成本率 (%)</label>
        <input 
            type="number" 
            className="input-field shadow-sm bg-white" 
            value={itemForm.cost || 0} 
            onChange={e => setItemForm({...itemForm, cost: Number(e.target.value)})} 
            placeholder="例如: 20 代表扣除 20%"
        />
    </div>
</div>
                        <div className="border-t pt-4 mt-2">
                            <label className="flex items-center gap-3 p-3 bg-slate-50 border rounded-lg cursor-pointer hover:bg-slate-100 transition-colors">
                                <input type="checkbox" className="w-5 h-5 accent-indigo-600" checked={itemForm.isProduct||false} onChange={e=>setItemForm({...itemForm, isProduct: e.target.checked})}/>
                                <div><div className="font-bold text-slate-700">啟用庫存管理</div></div>
                            </label>
                        </div>
                        <button onClick={handleSaveItem} className="btn btn-primary w-full py-4 mt-2 shadow-md">儲存項目</button>
                    </div>
                </Modal>
            )}
        </div>
    );
};         
            return (
                <div className="flex h-screen overflow-hidden bg-slate-100">
                    <aside className="hidden lg:flex flex-col w-64 bg-white border-r border-slate-200 z-20 shadow-sm">
                        <div className="p-6 hidden lg:flex flex items-center gap-3"><div className="w-10 h-10 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl shadow-lg shadow-indigo-200">S</div><div className="font-bold text-lg text-slate-800">專屬空間沙龍</div></div>
                        <nav className="flex-1 p-4 space-y-2">
                            {[ {id:'pos', icon:CreditCard, label:'收銀開單'}, {id:'orders', icon:ClipboardList, label:'查單管理'}, {id:'report', icon:Activity, label:'營運報表'}, {id:'customers', icon:User, label:'顧客資料'}, {id:'staff', icon:UserCog, label:'人員管理'}, {id:'inventory', icon:Box, label:'商品庫存'}, {id:'settings', icon:Settings, label:'系統設定'} ].map(item=>(<button key={item.id} onClick={()=>setActiveTab(item.id)} className={`w-full flex items-center gap-3 px-4 py-3.5 rounded-xl transition-all font-bold ${activeTab===item.id?'bg-indigo-50 text-indigo-600':'text-slate-500 hover:bg-slate-50 hover:text-slate-700'}`}><item.icon size={20}/>{item.label}</button>))}
                        </nav>                 
                        <div className="p-4 border-t border-slate-100 text-xs text-center text-slate-400 font-medium">Salon POS v18.0 Ultimate</div>
                    </aside>
                    
                    {/* 手機版全螢幕選單 */}
                    {isMobileMenuOpen && (
                        <div className="lg:hidden fixed inset-0 bg-slate-900/95 z-[100] pt-[env(safe-area-inset-top)] px-6 text-white animate-fade-in flex flex-col">
                            <div className="flex justify-between items-center py-6 border-b border-white/10">
                                <div className="font-bold text-xl">系統選單</div>
                                <button onClick={() => setIsMobileMenuOpen(false)} className="p-2"><X size={32}/></button>
                            </div>
                            <div className="flex-1 overflow-y-auto pt-4 pb-10">
                                {[ 
                                    {id:'pos', label:'開單'}, {id:'orders', label:'查單'}, {id:'report', label:'報表'}, 
                                    {id:'customers', label:'客資'}, {id:'staff', label:'人員'}, {id:'inventory', label:'庫存'}, {id:'settings', label:'設定'} 
                                ].map(item => (
                                    <button key={item.id} onClick={()=>{setActiveTab(item.id); setIsMobileMenuOpen(false);}} className="block text-2xl font-bold w-full text-left py-5 border-b border-white/5 active:bg-white/10">{item.label}</button>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* 主內容區 */}
                    <main className="flex-1 w-full h-screen overflow-hidden flex flex-col relative pt-[env(safe-area-inset-top)]">
                        {/* 手機版頂欄 */}
                        <div className="lg:hidden bg-white border-b p-4 h-16 flex justify-between items-center z-30 shadow-sm">
                            <div className="font-bold flex items-center gap-2 text-slate-800">
                                <div className="w-8 h-8 bg-indigo-600 rounded flex items-center justify-center text-white">S</div> 專屬空間
                            </div>
                            <button onClick={() => setIsMobileMenuOpen(true)} className="p-2 bg-slate-100 rounded-lg active:bg-slate-200"><Menu size={24}/></button>
                        </div>

                        <div className="flex-1 overflow-auto bg-slate-50">
                            {activeTab === 'pos' && <POSView />}
                            {activeTab === 'orders' && <OrderView />}
                            {activeTab === 'report' && <ReportView />}
                            {activeTab === 'customers' && <CustomerView />}
                            {activeTab === 'staff' && <StaffView />}
                            {activeTab === 'inventory' && <InventoryView />}
                            {activeTab === 'settings' && <SettingsView />}
                        </div>
                    </main>

                    <ConfirmModal {...confirmDialog} />
                    {notification && (
                        <div className={`fixed bottom-10 left-1/2 -translate-x-1/2 md:left-auto md:right-6 md:translate-x-0 px-6 py-3 rounded-2xl shadow-2xl z-[110] animate-fade-in text-white font-bold flex items-center gap-2 whitespace-nowrap ${notification.type==='error'?'bg-red-500':'bg-slate-800'}`}>
                            {notification.type==='error'?<X size={20}/>:<CheckCircle size={20}/>} {notification.msg}
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HairSalonApp />);
    </script>
</body>
</html>
